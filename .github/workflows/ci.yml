name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run unit tests
        run: go test -v .

      - name: Build binary and Gifkite.app bundle
        run: ./build-app.sh

      - name: Sanity check CLI
        run: ./gifkite displays
