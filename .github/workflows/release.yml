name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build and publish (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-release-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run unit tests
        run: go test -v .

      - name: Build & Package Gifkite.app bundle
        run: ./build-app.sh "${{ env.RELEASE_VERSION }}"

      - name: Package DMG & ZIP
        run: |
          mkdir -p dmg_root
          cp -R Gifkite.app dmg_root/
          ln -s /Applications dmg_root/Applications

          # Add first-run Gatekeeper helper script in the DMG root
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'echo "Authorizing Gifkite for first run..."' \
            'if [ -d "/Applications/Gifkite.app" ]; then' \
            '    xattr -cr /Applications/Gifkite.app 2>/dev/null || true' \
            '    open /Applications/Gifkite.app' \
            '    echo "Gifkite opened successfully!"' \
            'else' \
            '    echo "Please drag Gifkite.app to the Applications folder first, then double-click this helper."' \
            '    read -p "Press Enter to exit..."' \
            'fi' > "dmg_root/Open Gifkite (First Run).command"
          chmod +x "dmg_root/Open Gifkite (First Run).command"

          hdiutil create -volname "Gifkite" -srcfolder dmg_root -ov -format UDZO Gifkite-macOS.dmg
          rm -rf dmg_root

          ditto -c -k --sequesterRsrc --keepParent Gifkite.app Gifkite-macOS.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            Gifkite-macOS.dmg
            Gifkite-macOS.zip

  build-release-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Windows executable
        run: go build -ldflags="-H windowsgui -s -w -X main.Version=${{ env.RELEASE_VERSION }}" -o gifkite.exe .

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path gifkite.exe -DestinationPath Gifkite-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: Gifkite-Windows-x64.zip

  build-release-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Linux executable
        run: go build -ldflags="-s -w -X main.Version=${{ env.RELEASE_VERSION }}" -o gifkite .

      - name: Package Linux tarball
        run: |
          tar -czvf Gifkite-Linux-x64.tar.gz gifkite

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: Gifkite-Linux-x64.tar.gz

  publish-release:
    name: Tag & Publish Release
    needs: [build-release-macos, build-release-windows, build-release-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Git tag exists
        run: |
          TAG="${{ env.RELEASE_VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG already exists in repository."
          else
            echo "Creating and pushing git tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### 🚀 Installation (macOS)

            **Option 1: One-Line Terminal Install (Recommended)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/gifkite/gifkite/main/install.sh | bash
            ```

            **Option 2: Direct DMG Download**
            1. Download `Gifkite-macOS.dmg` and drag `Gifkite.app` into `/Applications`.
            2. If macOS displays *"Apple could not verify Gifkite is free of malware"*:
               - Run in Terminal: `xattr -cr /Applications/Gifkite.app`
               - Or right-click (Control-click) `Gifkite.app` in `/Applications`, choose **Open**, and confirm **Open**.
               - Or double-click the included `Open Gifkite (First Run).command` inside the DMG.
