name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build and publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-release-macos:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run unit tests
        run: go test -v .

      - name: Build Gifkite.app bundle
        run: ./build-app.sh "${{ env.RELEASE_VERSION }}"

      - name: Package DMG & ZIP
        run: |
          # Create a drag-and-drop installer disk image
          mkdir -p dmg_root
          cp -R Gifkite.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Gifkite" -srcfolder dmg_root -ov -format UDZO Gifkite-macOS.dmg
          rm -rf dmg_root

          # Also package standalone ZIP
          ditto -c -k --sequesterRsrc --keepParent Gifkite.app Gifkite-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            Gifkite-macOS.dmg
            Gifkite-macOS.zip
          generate_release_notes: true

  build-release-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Windows executable
        run: go build -ldflags="-H windowsgui -s -w -X main.Version=${{ env.RELEASE_VERSION }}" -o gifkite.exe .

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path gifkite.exe -DestinationPath Gifkite-Windows-x64.zip

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            Gifkite-Windows-x64.zip
          generate_release_notes: true

  build-release-linux:
    name: Build & Release (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Linux executable
        run: go build -ldflags="-s -w -X main.Version=${{ env.RELEASE_VERSION }}" -o gifkite .

      - name: Package Linux tarball
        run: |
          tar -czvf Gifkite-Linux-x64.tar.gz gifkite

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            Gifkite-Linux-x64.tar.gz
          generate_release_notes: true
