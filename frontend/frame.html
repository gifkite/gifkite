<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  /* the window is the region plus 6px on every side; the border lives in that margin */
  #edge { position: fixed; inset: 1px; border: 2px solid color-mix(in srgb, var(--rec) 65%, transparent); }
  #edge i { position: absolute; width: 26px; height: 26px; border: 4px solid var(--rec); }
  #edge i:nth-child(1) { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
  #edge i:nth-child(2) { top: -3px; right: -3px; border-left: 0; border-bottom: 0; }
  #edge i:nth-child(3) { bottom: -3px; left: -3px; border-right: 0; border-top: 0; }
  #edge i:nth-child(4) { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
  #count {
    position: fixed; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px;
    display: none; place-items: center; border-radius: 50%;
    background: rgba(20, 22, 26, 0.72); color: #fff; font-size: 60px; font-weight: 700;
  }
  #count.show { display: grid; animation: tick 1s ease-out; }
  @keyframes tick { from { transform: scale(1.18); opacity: 0.3; } 25% { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="edge"><i></i><i></i><i></i><i></i></div>
<div id="count" class="num"></div>
<script type="module">
import { Events } from "/wails/runtime.js";
const c = document.getElementById("count");
Events.On("countdown", (e) => {
  c.classList.remove("show");
  if (e.data > 0) {
    c.textContent = e.data;
    void c.offsetWidth; // restart the animation
    c.classList.add("show");
  }
});
</script>
</body>
</html>
