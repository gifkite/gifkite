version: '3'

vars:
  VERSION: '{{.VERSION | default "0.2.0"}}'

tasks:
  default:
    desc: "Run tests and build macOS app"
    cmds:
      - task: test
      - task: build:mac

  dev:
    desc: "Build and launch Gifkite locally"
    cmds:
      - pkill -f gifkite || true
      - task: build:mac
      - open Gifkite.app
      - echo "Gifkite launched! Check your macOS menu bar."

  test:
    desc: "Run all unit tests"
    cmds:
      - go test -v .

  build:
    desc: "Build default platform (macOS)"
    cmds:
      - task: build:mac

  build:mac:
    desc: "Build Gifkite.app bundle for macOS (optional: task build:mac VERSION=0.2.0)"
    cmds:
      - ./build-app.sh "{{.VERSION}}"

  build:windows:
    desc: "Cross-compile Windows executable (optional: task build:windows VERSION=0.2.0)"
    cmds:
      - GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w -X main.Version={{.VERSION}}" -o gifkite.exe .
      - echo "Built gifkite.exe (version {{.VERSION}}) successfully!"

  build:linux:
    desc: "Build Linux binary (optional: task build:linux VERSION=0.2.0)"
    cmds:
      - go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o gifkite .
      - echo "Built gifkite for Linux (version {{.VERSION}}) successfully!"

  package:mac:
    desc: "Build and package macOS DMG and ZIP installer"
    cmds:
      - task: build:mac VERSION={{.VERSION}}
      - rm -rf dmg_root Gifkite-macOS-{{.VERSION}}.dmg Gifkite-macOS-{{.VERSION}}.zip
      - mkdir -p dmg_root
      - cp -R Gifkite.app dmg_root/
      - ln -s /Applications dmg_root/Applications
      - hdiutil create -volname "Gifkite" -srcfolder dmg_root -ov -format UDZO Gifkite-macOS-{{.VERSION}}.dmg
      - rm -rf dmg_root
      - ditto -c -k --sequesterRsrc --keepParent Gifkite.app Gifkite-macOS-{{.VERSION}}.zip
      - echo "Created Gifkite-macOS-{{.VERSION}}.dmg and Gifkite-macOS-{{.VERSION}}.zip"

  release:
    desc: "Tag and push a new release to trigger CI build (usage: task release TAG=v0.2.0)"
    cmds:
      - 'test -n "{{.TAG}}" || (echo "ERROR: TAG is required. Example: task release TAG=v0.2.0" && exit 1)'
      - git tag -a {{.TAG}} -m "Release {{.TAG}}"
      - git push origin {{.TAG}}
      - echo "Pushed {{.TAG}} to origin! GitHub Actions is now building and publishing the release."

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf Gifkite.app gifkite gifkite.exe *.zip *.dmg *.tar.gz dmg_root
